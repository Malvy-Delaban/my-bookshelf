<!DOCTYPE HTML>
<html>
<title>My Bookshelf</title>
<link rel="icon" type="image/x-icon" href="/assets/icon.ico">

<!-- DISCORD PREVIEW -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://my-bookshelf.malvy-delaban.fr/">
<meta property="og:title" content="Malvy's Bookshelf">
<meta property="og:description" content="A simple book collection.">

<!-- IMPORT FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lugrasimo&family=Pinyon+Script&display=swap" rel="stylesheet">

<!-- INITIALIZE DATASETS -->
<script src="collection.js"></script>
<script src="wishlist.js"></script>

<!-- STYLE -->
<style type="text/css">
    html,
    body {
        width: 100%;
        font-family: "Pinyon Script", cursive;
    }

    html {
        background: radial-gradient(circle at 22% 26%, #020617 0%, transparent 44%), radial-gradient(circle at 56% 52%, #131921 0%, transparent 44%), radial-gradient(circle at 84% 76%, #0c1c1f 0%, transparent 44%), linear-gradient(135deg, #020617, #07070d);
        color: white;
        font-family: "Commissioner", sans-serif;
        min-height: 100vh;
    }

    body {
        margin: 0;
        padding: 0;
    }

    .titles-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    h1 {
        margin-top: 2rem;
        margin-bottom: 2rem;
        font-family: "Pinyon Script", cursive;
        color: #ffdd84;
        font-size: 4rem;
        font-weight: normal;
        background: -webkit-linear-gradient(#ffdd84, #c9a064);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .button-access-wishlist {
        background: linear-gradient(rgb(102, 98, 78), rgb(112, 105, 81));
        color: wheat;
        border: transparent 0;
        border-radius: 0.3rem;
        padding: 0.5rem 1rem;
        font-weight: bold;
        font-size: 1rem;
        transition: 200ms;
        width: fit-content;
        margin-left: 1rem;
        font-family: "Lugrasimo", cursive;
    }

    .button-access-wishlist:hover {
        background: linear-gradient(rgb(102, 83, 78), rgb(112, 90, 81));
        color: rgb(245, 189, 179);
        cursor: pointer;
        transform: scale(1.05) rotate(1.5deg);
    }

    #my-collection {
        width: calc(100% - 5rem);
        padding: 0 2.5rem 2rem;
        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .book-div-container {
        display: flex;
        flex-direction: row;
        gap: 1rem;
        border-radius: 0.5rem;
        padding: 2rem;
        background: linear-gradient(#1c224163, #0f0d2463);
        border: 0.2rem solid rgba(255, 255, 255, 0.068);
    }

    .book-div {
        width: 20rem;
        height: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .book-cover {
        height: 25rem;
        width: auto;
    }

    .book-title {
        text-align: center;
        text-wrap: wrap;
        color: wheat;
        height: 3rem;
    }

    .book-details {
        text-align: center;
        text-wrap: wrap;
        font-size: 0.9rem;
        font-family: "Lugrasimo", cursive;
        color: wheat;
    }

    .book-margin-top {
        margin-top: 1rem;
    }

    .book-hype {
        margin-top: 0.5rem;
        text-align: center;
        text-wrap: wrap;
        font-size: 0.8rem;
        font-family: "Lugrasimo", cursive;
        color: wheat;
    }

    h3 {
        margin-top: 0;
        font-size: 1rem;
        font-family: "Lugrasimo", cursive;
    }

    .book-collection-container {
        width: 24.4rem;
        margin-top: 4rem;
        margin-bottom: 4rem;
        display: flex;
        flex-direction: column;
        justify-content: left;
        align-items: start;
    }

    .book-collection-volumes {
        width: 100%;
        display: flex;
        flex-direction: row;
        gap: 0.4rem;
        flex-wrap: wrap;
        justify-content: left;
        align-content: flex-start;
    }

    .volume-square {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 0.3rem;
    }

    .volume-owned {
        background-color: rgb(71, 167, 71);
        border: solid rgb(71, 167, 71) 3px;
    }

    .volume-unowned {
        background-color: rgb(27, 25, 34);
        border: solid rgba(255, 255, 255, 0.1) 3px;
    }

    .book-collection-status {
        width: 100%;
        margin: 0;
        font-weight: 300;
        color: wheat;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
    }

    .color-status-white {
        color: white;
    }

    .filter-container {
        width: calc(100% - 20rem);
        display: flex;
        flex-direction: row;
        gap: 1rem;
        margin: 2rem 10rem 1rem;
        font-family: "Lugrasimo", cursive;
        color: wheat;
        align-items: center;
    }

    .filter-button {
        background-color: black;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        color: white;
    }

    .filter-button:hover {
        cursor: pointer;
        text-decoration: underline;
    }

    .roman-filter-color {
        background-color: rgb(115, 134, 96);
    }

    .comics-filter-color {
        background-color: rgb(96, 134, 116);
    }

    .manga-filter-color {
        background-color: rgb(96, 122, 134);
    }

    .encyclopedie-filter-color {
        background-color: rgb(102, 96, 134);
    }

    .jeux-filter-color {
        background-color: rgb(133, 96, 134);
    }

    .art-filter-color {
        background-color: rgb(102, 78, 81);
    }

    .unselected-filter {
        opacity: 50%;
    }

    .book-number-container {
        width: calc(100% - 20rem);
        display: flex;
        flex-direction: row;
        gap: 0.6rem;
        margin: 0 2rem 2rem;
        font-family: "Lugrasimo", cursive;
        color: wheat;
        align-items: center;
    }

    .book-number {
    }
</style>

<!-- HTML -->

<body>
    <div class="titles-container">
        <h1>My Bookshelf</h1>
        <button class="button-access-wishlist" onclick="location.href='/wishlist.html';">Wishlist</button>
        <div class="filter-container">
            <span>Filter by:</span>
            <div id="roman-filter" class="filter-button unselected-filter roman-filter-color"
                onClick="filterBy('Roman')">Roman</div>
            <div id="comics-filter" class="filter-button unselected-filter comics-filter-color"
                onClick="filterBy('Comics')">BD & Comics</div>
            <div id="manga-filter" class="filter-button unselected-filter manga-filter-color"
                onClick="filterBy('Manga')">Manga</div>
            <div id="encyclopedie-filter" class="filter-button unselected-filter encyclopedie-filter-color"
                onClick="filterBy('Encyclopedie')">Encyclopedia</div>
            <div id="jeux-filter" class="filter-button unselected-filter jeux-filter-color"
                onClick="filterBy('JeuxVideos')">Video Games</div>
            <div id="art-filter" class="filter-button unselected-filter art-filter-color" onClick="filterBy('Art')">Art
            </div>
        </div>
        <div class="book-number-container">
            <span id="book-number">0</span>
            <span>Books found from</span>
            <span id="series-number">0</span>
            <span>different series</span>
        </div>
    </div>
    <div id="my-collection">
    </div>
</body>

<!-- SCRIPTS -->
<script>
    function hasVolume(targetVolume, volumes) {
        return volumes.some((entry) => {
            if (typeof entry === "string" && entry.includes("-")) {
                const [min, max] = entry.split("-").map(Number);
                return targetVolume >= min && targetVolume <= max;
            }

            return Number(entry) === targetVolume;
        });
    }

    function getCompletionPercentage(last_volume, volumes) {
        var countOwned = 0;

        for (var i = 1; i <= last_volume; i++)
            countOwned += (hasVolume(i, volumes) ? 1 : 0);
        return (countOwned / last_volume * 100).toFixed(1);
    }

    function getVolumeNumber(last_volume, volumes) {
        var countOwned = 0;

        for (var i = 1; i <= last_volume; i++)
            countOwned += (hasVolume(i, volumes) ? 1 : 0);
        return countOwned;
    }

    function createElement(book) {
        const bookDivContainer = document.createElement("div");
        bookDivContainer.classList.add("book-div-container");

        const bookDiv = document.createElement("div");
        bookDiv.classList.add("book-div");

        const bookTitle = document.createElement("h3");
        bookTitle.classList.add("book-title");
        bookTitle.innerHTML = book.name;

        const bookCover = document.createElement("img");
        bookCover.classList.add("book-cover");
        bookCover.src = `assets/covers/${book.pic}`;

        const bookAuthor = document.createElement("div");
        bookAuthor.classList.add("book-margin-top");
        bookAuthor.classList.add("book-details");
        bookAuthor.innerHTML = `Author: ${book.author}`;

        const bookPublisher = document.createElement("div");
        bookPublisher.classList.add("book-details");
        bookPublisher.innerHTML = `Publisher: ${book.publisher}`;

        const bookDateAdded = document.createElement("div");
        bookDateAdded.classList.add("book-details");
        bookDateAdded.classList.add("book-date-added");
        bookDateAdded.innerHTML = `Added on: ${book.dateAdded}`;


        bookDiv.appendChild(bookTitle);
        bookDiv.appendChild(bookCover);
        bookDiv.appendChild(bookAuthor);
        bookDiv.appendChild(bookPublisher);
        bookDiv.appendChild(bookDateAdded);
        bookDivContainer.appendChild(bookDiv);

        if (book.collection_state) {
            const bookCollectionContainer = document.createElement("div");
            bookCollectionContainer.classList.add("book-collection-container");

            const bookCollectionStatus = document.createElement("h3");
            bookCollectionStatus.classList.add("book-collection-status");
            bookCollectionStatus.innerHTML = `<span>Serie status:</span><span class="color-status-white">${book.collection_state.is_finished ? "Finished" : "On going"}</span>`;

            const bookCollectionCompletion = document.createElement("h3");
            bookCollectionCompletion.classList.add("book-collection-status");
            bookCollectionCompletion.innerHTML = `<span>Completion status:</span><span class="color-status-white">${getCompletionPercentage(book.collection_state.last_volume_published, book.collection_state.volumes)}%</span>`;

            const bookCollectionLastUpdated = document.createElement("h3");
            bookCollectionLastUpdated.classList.add("book-collection-status");
            bookCollectionLastUpdated.innerHTML = `<span>Collection updated on:</span><span class="color-status-white">${book.collection_state.updated_on}</span>`;

            const bookCollectionVolumes = document.createElement("div");
            bookCollectionVolumes.classList.add("book-collection-volumes", "book-margin-top");

            for (var i = 1; i <= book.collection_state.last_volume_published; i++) {
                const volume = document.createElement("div");
                volume.classList.add("volume-square");
                if (hasVolume(i, book.collection_state.volumes)) {
                    volume.classList.add("volume-owned");
                    volume.title = `Volume ${i} is owned`;
                }
                else {
                    volume.title = `Volume ${i} isn't owned`;
                    volume.classList.add("volume-unowned");
                }
                bookCollectionVolumes.appendChild(volume);
            }
            bookCollectionContainer.appendChild(bookCollectionStatus);
            bookCollectionContainer.appendChild(bookCollectionCompletion);
            bookCollectionContainer.appendChild(bookCollectionLastUpdated);
            bookCollectionContainer.appendChild(bookCollectionVolumes);
            bookDivContainer.appendChild(bookCollectionContainer);
        }

        return bookDivContainer;
    }

    function fillCollection() {
        const collectionDiv = document.getElementById("my-collection");

        sortedCollection.forEach(element => {
            if (element.isDisplayed)
                collectionDiv.appendChild(createElement(element));
        });
        displayBookNumbers();
    }

    function resetDisplay() {
        const containerDiv = document.getElementById("my-collection");
        containerDiv.innerHTML = '';
    }

    function applyFilter() {
        resetDisplay();
        defaultSelection();

        collection.forEach(book => {
            console.log(book.tags.includes("Roman"));
            if (!book.tags.includes("Roman") && filterStatusRoman)
                book.isDisplayed = false;
            else if (!book.tags.includes("BD & Comics") && filterStatusComics)
                book.isDisplayed = false;
            else if (!book.tags.includes("Manga") && filterStatusManga)
                book.isDisplayed = false;
            else if (!book.tags.includes("Encyclopédie") && filterStatusEncyclopedie)
                book.isDisplayed = false;
            else if (!book.tags.includes("Jeux Vidéos") && filterStatusJeuxVideos)
                book.isDisplayed = false;
            else if (!book.tags.includes("Art") && filterStatusArt)
                book.isDisplayed = false;
        });
        fillCollection();
    }

    function defaultSelection() {
        sortedCollection = collection;
        sortedCollection.forEach(book => {
            book.isDisplayed = true;
        });
    }

    function filterBy(filter) {
        if (filter == "Roman") {
            filterStatusRoman = !filterStatusRoman;
            const button = document.getElementById("roman-filter")
            button.classList.remove("unselected-filter");
            if (!filterStatusRoman)
                button.classList.add("unselected-filter");
        }
        if (filter == "Comics") {
            filterStatusComics = !filterStatusComics;
            const button = document.getElementById("comics-filter")
            button.classList.remove("unselected-filter");
            if (!filterStatusComics)
                button.classList.add("unselected-filter");
        } if (filter == "Manga") {
            filterStatusManga = !filterStatusManga;
            const button = document.getElementById("manga-filter")
            button.classList.remove("unselected-filter");
            if (!filterStatusManga)
                button.classList.add("unselected-filter");
        } if (filter == "Encyclopedie") {
            filterStatusEncyclopedie = !filterStatusEncyclopedie;
            const button = document.getElementById("encyclopedie-filter")
            button.classList.remove("unselected-filter");
            if (!filterStatusEncyclopedie)
                button.classList.add("unselected-filter");
        } if (filter == "JeuxVideos") {
            filterStatusJeuxVideos = !filterStatusJeuxVideos;;
            const button = document.getElementById("jeux-filter")
            button.classList.remove("unselected-filter");
            if (!filterStatusJeuxVideos)
                button.classList.add("unselected-filter");
        } if (filter == "Art") {
            filterStatusArt = !filterStatusArt;;
            const button = document.getElementById("art-filter")
            button.classList.remove("unselected-filter");
            if (!filterStatusArt)
                button.classList.add("unselected-filter");
        }
        applyFilter();
    }

    function getBookNumber() {
        var count = 0;
        sortedCollection.forEach(book => {
            if (book.isDisplayed && book.collection_state) {
                count += getVolumeNumber(book.collection_state.last_volume_published, book.collection_state.volumes);
            } else if (book.isDisplayed)
                count++;
        });
        return count;
    }

    function getSerieNumber() {
        var count = 0;
        sortedCollection.forEach(book => {
            if (book.isDisplayed)
                count++;
        });
        return count;
    }

    function displayBookNumbers() {
        const bookNumber = document.getElementById("book-number");
        const seriesNumber = document.getElementById("series-number");

        bookNumber.innerHTML = getBookNumber();
        seriesNumber.innerHTML = getSerieNumber();
    }

    // FILTERS
    var filterStatusRoman = false;
    var filterStatusComics = false;
    var filterStatusManga = false;
    var filterStatusEncyclopedie = false;
    var filterStatusJeuxVideos = false;
    var filterStatusArt = false;

    var sortedCollection = collection;
    defaultSelection();
    fillCollection();
</script>

</html>
